name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - run: python scripts/lint_gpt_project.py --project-root .

      - name: Validate GPT Builder 1.5 platform contracts
        run: python scripts/validate_platform_contracts.py

      - run: python scripts/project_hygiene.py --project-root . --mode checkpoint

      - name: Validate news robustness and hygiene
        run: python scripts/validate_news_robustness.py

      - run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci
      - run: python scripts/validate_distributions.py --project-root . --version 0.0.0-ci
      - run: python scripts/validate_runtime_parity.py --project-root .

      - name: Validate release asset set
        run: python scripts/validate_release_assets.py --version 0.0.0-ci

      - name: Validate eval suite
        run: python scripts/validate_evals.py --project-root .

      - name: Validate final release readiness
        run: python scripts/validate_release_readiness.py
