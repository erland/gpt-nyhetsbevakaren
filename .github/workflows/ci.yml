name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/lint_gpt_project.py --project-root .
      - run: python scripts/project_hygiene.py --project-root . --mode checkpoint
      - run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,custom-gpt
      - run: python scripts/validate_distributions.py --project-root .
      - run: python scripts/validate_runtime_parity.py --project-root .

      - name: Validate eval suite
        run: python scripts/validate_evals.py --project-root .
